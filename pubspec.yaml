name: vocus
description: A Flutter app that adjusts device volume from Google Calendar events.
publish_to: none
version: 1.1.0
environment:
  sdk: ^3.11.5
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  flutter_riverpod: ^3.3.1
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.5
  flutter_volume_controller: ^2.0.2
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  riverpod_annotation: ^4.0.2
  http: ^1.6.0
  permission_handler: ^13.0.2
  shimmer: ^4.0.0
  flutter_foreground_task: ^11.0.3
  workmanager: ^0.10.10
  do_not_disturb: ^1.0.3
  flutter_dotenv: ^6.0.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.3
  build_runner: ^2.16.2
flutter:
  uses-material-design: true
  assets:
    - .env
